<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profile Summary Card</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
      margin: 40px;
      background: #f7fafc;
      color: #334155;
    }
    .card {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }
    .card h1 {
      margin-bottom: 16px;
      font-size: 24px;
    }
    .card p {
      margin-bottom: 16px;
      line-height: 1.75;
    }
    .card img {
      width: 100%;
      max-width: 640px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .card a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>GitHub Profile Summary Card</h1>
    <p>這是使用 <strong>GitHub Profile Summary Cards</strong> 的範例，已經嵌入你的 GitHub 使用者名稱 <strong>AImaster888</strong>。</p>
    <a href="https://github.com/AImaster888" target="_blank" rel="noopener noreferrer">前往 GitHub 個人頁面</a>
    <img src="https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=AImaster888&theme=default" alt="AImaster888 GitHub Profile Summary Card" />
    <p>如果要把卡片放到網頁上，只要使用這個圖片 URL：</p>
    <pre>https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=AImaster888&theme=default</pre>
  </div>
</body>
</html>
